server {
    listen 80;
    server_name multiagentragsystem.health;

    root /usr/share/nginx/html;
    index index.html;

    # DNS server: filled in at container start from /etc/resolv.conf (nginx image's
    # NGINX_ENTRYPOINT_LOCAL_RESOLVERS), so it is Docker's 127.0.0.11 under compose
    # and the cluster DNS under Kubernetes. Resolving api-gateway through a variable
    # (rather than a bare hostname in proxy_pass) makes nginx look it up at
    # request time instead of once when the config loads - a plain hostname
    # fails to even parse ("host not found in upstream") if api-gateway
    # isn't already up/registered at that exact moment, which crashes nginx
    # outright and takes the whole frontend container down with it. This
    # also means frontend survives api-gateway restarting later (it has
    # restart: always), not just the initial startup race.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # nginx's resolver ignores resolv.conf search domains, so under Kubernetes this
    # must be the full service name (set in k8s/frontend.yaml); compose uses the short one.
    location /api/ {
        # A proxy_pass with a variable disables nginx's own URI rewriting, even with
        # the trailing slash below - so the /api/ prefix must be stripped explicitly,
        # otherwise the gateway (routes are /auth/login etc., no prefix) returns 404.
        # Order matters: "set" must come before "rewrite ... break", because "break"
        # ends rewrite-phase processing and anything after it is skipped (nginx then
        # logs 'using uninitialized "api_gateway_upstream" variable', 500 to client).
        set $api_gateway_upstream http://${API_GATEWAY_HOST}:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}