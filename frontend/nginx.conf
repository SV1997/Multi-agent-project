server {
    listen 80;
    server_name multiagentragsystem.online;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving api-gateway through a variable
    # (rather than a bare hostname in proxy_pass) makes nginx look it up at
    # request time instead of once when the config loads - a plain hostname
    # fails to even parse ("host not found in upstream") if api-gateway
    # isn't already up/registered at that exact moment, which crashes nginx
    # outright and takes the whole frontend container down with it. This
    # also means frontend survives api-gateway restarting later (it has
    # restart: always), not just the initial startup race.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_gateway_upstream http://api-gateway:3000;
        proxy_pass $api_gateway_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}