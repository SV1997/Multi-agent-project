# DRAFT v1, built from the cleaned corpus inventory (25 Oct 2026). Documents are keyed by the source file name:
# the name a chunk's "source" ends with, or the name the file was uploaded under (not the doc id: the stored
# doc_id is per chunk in this index, so it cannot identify a document).
# HR is worked out in detail. The other domains are deliberately coarse: one or two files each.
version: 1

hr:
  categories:
    leave:
      description: "All leave types: entitlement, eligibility, carry forward, encashment, how to apply"
      parents: []
    earned_leave:
      description: "Earned (privilege) leave: accrual, carry forward, encashment, notice before taking it"
      parents: [leave]
    casual_and_sick_leave:
      description: "Casual and sick leave: entitlement, expiry at year end, medical certificate rules"
      parents: [leave]
    family_leave:
      description: "Maternity, adoption and marriage leave"
      parents: [leave]
    comp_off_and_lwp:
      description: "Compensatory off for extra work and leave without pay"
      parents: [leave]
    attendance_and_remote_work:
      description: "Working hours, flexible hours, attendance, regularization, work from home and office attendance"
      parents: []
    payroll_and_tax:
      description: "Salary payment, salary structure, salary slips, tax documents and statutory deductions"
      parents: []
    salary_payment:
      description: "Salary credit date, payroll cutoff, salary structure, variable pay and deductions"
      parents: [payroll_and_tax]
    salary_slip_and_tax_docs:
      description: "Salary slip contents and access, Form 16, tax proofs and tax computation"
      parents: [payroll_and_tax]
    provident_fund_and_gratuity:
      description: "Provident fund and gratuity: eligibility, contributions, payout"
      parents: [payroll_and_tax, benefits_and_expenses]   # second parent: asked both as "what is deducted from my salary" and "what benefits do I get"
    benefits_and_expenses:
      description: "Insurance, retirement benefits, reimbursements and business travel"
      parents: []
    medical_insurance:
      description: "Group medical insurance: enrolment, dependants, insurance card, claims"
      parents: [benefits_and_expenses]
    reimbursements_and_travel:
      description: "Expense claims, reimbursement limits and categories, business travel rules"
      parents: [benefits_and_expenses]
    employment_documents:
      description: "Letters and certificates: employment verification, experience, relieving, salary certificate, offer, increment, joining letter, ID card"
      parents: []
    separation:
      description: "Resignation, notice period, handover, exit clearance and final settlement"
      parents: []
    resignation_and_notice:
      description: "How to resign, notice period length, notice buyout, notice during probation"
      parents: [separation]
    exit_and_settlement:
      description: "Knowledge transfer, exit clearance, asset return and full and final settlement"
      parents: [separation]
    probation_and_performance:
      description: "Probation and confirmation, performance cycle and ratings, increments, internal job postings"
      parents: []
    conduct_and_security:
      description: "Code of conduct, background verification, information security and company equipment"
      parents: []
    hr_support_and_policy_admin:
      description: "Raising HR requests, helpdesk categories, response times, escalation, policy exceptions and updates, who the policies cover"
      parents: []
    facilities_register:
      description: "Register of employee floor seating and tickets resolved: lookup data, not policy"
      parents: []
  documents:
    tmp5jdxnb7a.pdf:
      title: "NovaSphere HR Policy and Employee Services Handbook"
      categories: [earned_leave, casual_and_sick_leave, family_leave, comp_off_and_lwp, attendance_and_remote_work,
                   salary_payment, salary_slip_and_tax_docs, provident_fund_and_gratuity, medical_insurance,
                   reimbursements_and_travel, employment_documents, resignation_and_notice, exit_and_settlement,
                   probation_and_performance, conduct_and_security, hr_support_and_policy_admin]
    tmppcv6jeno.pdf:
      title: "AcmeNova Short Demo HR Handbook"
      categories: [earned_leave, casual_and_sick_leave, attendance_and_remote_work, salary_payment,
                   salary_slip_and_tax_docs, medical_insurance, reimbursements_and_travel, resignation_and_notice,
                   exit_and_settlement, probation_and_performance, conduct_and_security, hr_support_and_policy_admin]
    tmpueqswgxe.md:
      title: "HR Facilities and Ticket-Resolution Register"
      categories: [facilities_register]
  mixed: [tmp5jdxnb7a.pdf, tmppcv6jeno.pdf]

