volumes:
  seaweed_data:
  postgres_data:

services:
  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    env_file:
      - ./services/retrieval-service/.env
    ports:
      - "8001:8001"

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    env_file:
      - ./services/ingestion_service/.env
    ports:
     - "8002:8002"
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file:
      - ./services/orchestrator/.env
    environment:
      RETRIVAL_SERVICE_URL: http://retrieval-service:8001
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - retrieval-service

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation_service/Dockerfile
    env_file:
      - ./services/evaluation_service/.env
    ports:
      - "8004:8004"

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
  api-gateway:
    build: ./services/api-gateway
    env_file:
      - ./services/api-gateway/.env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8003/api/v1/query
      INGESTION_URL: http://ingestion-service:8002/api/v1/ingest
      EVALUATION_SERVICE_URL: http://evaluation-service:8004/api/v1/evaluate
    ports:
      - "3000:3000"
    depends_on:
      # - postgres
      - orchestrator
      - ingestion-service
      - evaluation-service
      - seaweedfs
    restart: always
  frontend:
    build: 
      context: ./frontend
      args:
        VITE_BASE_URL: http://localhost:3000
        
    ports:
      - "80:80"
  # frontend:
  #   build: 
  #     context: ./frontend
  #     args:
  #       VITE_BASE_URL: https://multiagentragsystem.duckdns.org/api
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gateway_db}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql 