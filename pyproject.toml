[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.2",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "locust>=2.46.4",
    "pydantic>=2.13.4",
]
[tool.uv.workspace]
members = [
    "services/retrieval-service",
    "services/orchestrator",
    "services/ingestion_service",
    "services/evaluation_service",
    "locust-test",
]

# CPU-only PyTorch: re-ranking runs a small model on CPU, and the default Linux wheel drags in ~3 GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
