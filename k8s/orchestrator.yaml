apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata: 
      labels:
        app: orchestrator
    spec:
      imagePullSecrets:            # ← imagePullSecrets goes HERE
        - name: ecr-secret
      containers:
        - name: orchestrator
          image: 635668539225.dkr.ecr.ap-south-1.amazonaws.com/orchestrator:2bd0f739bf9604a45c48d485e7e416617a0db182
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: orchestrator-env

---

apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: 
    app: orchestrator
  ports:
    - port: 8003
      targetPort: 8003