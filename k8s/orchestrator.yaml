apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata: 
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: 635668539225.dkr.ecr.ap-south-1.amazonaws.com/orchestrator:latest
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: orchestrator-env

---

apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: 
    app: orchestrator
  ports:
    - port: 8003
      targetPort: 8003