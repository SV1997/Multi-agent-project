apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweed-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs
          args: ["server", "-s3", "-s3.port=8333", "-dir=/data"]
          ports:
            - containerPort: 8333
            - containerPort: 9333
          volumeMounts:
            - name: seaweed-storage
              mountPath: /data
      volumes:
        - name: seaweed-storage
          persistentVolumeClaim:
            claimName: seaweed-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333