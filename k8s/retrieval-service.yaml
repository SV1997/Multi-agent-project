apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-service
  template:
    metadata:
      labels:
        app: retrieval-service
    spec:
      imagePullSecrets:            # ← imagePullSecrets goes HERE
        - name: ecr-secret
      containers:
        - name: retrieval-service
          image: 635668539225.dkr.ecr.ap-south-1.amazonaws.com/retrieval-service:33538245f08572c367c707e9a7ce2728a9284928
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: retrieval-service-env
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
spec:
  selector:
    app: retrieval-service
  ports:
    - port: 8001
      targetPort: 8001