name: Deploy to Production

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push retrieval-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/retrieval-service:latest -t $REGISTRY/retrieval-service:${{ github.sha }} -f services/retrieval-service/Dockerfile .
          docker push $REGISTRY/retrieval-service:latest
          docker push $REGISTRY/retrieval-service:${{ github.sha }}

      - name: Build, tag, and push ingestion-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/ingestion-service:latest -t $REGISTRY/ingestion-service:${{ github.sha }} -f services/ingestion_service/Dockerfile .
          docker push $REGISTRY/ingestion-service:latest
          docker push $REGISTRY/ingestion-service:${{ github.sha }}

      - name: Build, tag, and push orchestrator
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/orchestrator:latest -t $REGISTRY/orchestrator:${{ github.sha }} -f services/orchestrator/Dockerfile .
          docker push $REGISTRY/orchestrator:latest
          docker push $REGISTRY/orchestrator:${{ github.sha }}

      - name: Build, tag, and push evaluation-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/evaluation-service:latest -t $REGISTRY/evaluation-service:${{ github.sha }} -f services/evaluation_service/Dockerfile .
          docker push $REGISTRY/evaluation-service:latest
          docker push $REGISTRY/evaluation-service:${{ github.sha }}

      - name: Build, tag, and push api-gateway
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/api-gateway:latest -t $REGISTRY/api-gateway:${{ github.sha }} services/api-gateway
          docker push $REGISTRY/api-gateway:latest
          docker push $REGISTRY/api-gateway:${{ github.sha }}

      - name: Build, tag, and push frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/frontend:latest \
            --build-arg VITE_BASE_URL=https://multiagentragsystem.online/api \
            ./frontend
          docker build -t $REGISTRY/frontend:${{ github.sha }} \
            --build-arg VITE_BASE_URL=https://multiagentragsystem.online/api \
            ./frontend
          docker push $REGISTRY/frontend:latest
          docker push $REGISTRY/frontend:${{ github.sha }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|retrieval-service:latest|retrieval-service:${{ github.sha }}|g" k8s/retrieval-service.yaml
          sed -i "s|ingestion-service:latest|ingestion-service:${{ github.sha }}|g" k8s/ingestion-service.yaml
          sed -i "s|orchestrator:latest|orchestrator:${{ github.sha }}|g" k8s/orchestrator.yaml
          sed -i "s|evaluation-service:latest|evaluation-service:${{ github.sha }}|g" k8s/evaluation-service.yaml
          sed -i "s|api-gateway:latest|api-gateway:${{ github.sha }}|g" k8s/api-gateway.yaml
          sed -i "s|frontend:latest|frontend:${{ github.sha }}|g" k8s/frontend.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "chore: update image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push